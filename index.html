<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Start Moto | Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-green: #00e676;
            --primary-red: #ff5252;
            --primary-blue: #2196F3;
            --primary-orange: #ff9800;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }

        .dashboard-container {
            width: 90%;
            max-width: 600px; /* Mas malaki na para sa laptop */
            padding: 20px;
        }

        .card { 
            background-color: var(--card-bg); 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
            text-align: center;
        }

        h1 { color: var(--primary-green); font-size: 28px; letter-spacing: 2px; margin-bottom: 25px; }

        .status-panel { margin-bottom: 25px; }

        .status { 
            padding: 20px; 
            border-radius: 15px; 
            background: #252525; 
            font-weight: bold; 
            font-size: 22px;
            border: 3px solid #444;
            transition: 0.3s;
        }

        /* Kulay ng Status Border */
        .status.on { border-color: var(--primary-green); color: var(--primary-green); }
        .status.off { border-color: var(--primary-red); color: var(--primary-red); }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn { 
            padding: 20px; 
            border: none; 
            border-radius: 15px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
            text-transform: uppercase;
            user-select: none;
        }

        .btn:active { transform: scale(0.96); }

        .btn-start { background: var(--primary-green); color: #000; }
        .btn-stop { background: var(--primary-red); color: #fff; }
        .btn-horn { background: var(--primary-blue); color: #fff; grid-column: span 2; }
        .btn-hazard { background: var(--primary-orange); color: #fff; grid-column: span 2; }

        .anti-theft { 
            margin-top: 30px; 
            padding-top: 20px; 
            border-top: 1px solid #444; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Toggle Switch Styling */
        .switch { position: relative; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #555; transition: .4s; border-radius: 34px; }
