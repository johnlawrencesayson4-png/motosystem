<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Start Moto</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 300px; }
        h1 { color: #00e676; font-size: 24px; }
        .status { margin: 20px 0; padding: 10px; border-radius: 10px; background: #333; font-weight: bold; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-start { background: #00e676; color: black; }
        .btn-stop { background: #ff5252; color: white; }
        .btn:active { transform: scale(0.95); }
        .anti-theft { margin-top: 20px; border-top: 1px solid #444; padding-top: 20px; }
        .toggle-container { display: flex; justify-content: space-between; align-items: center; }
        /* Simple Toggle Switch */
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
  <script type="module" crossorigin src="/assets/index-BF_-tRWG.js"></script>
</head>
<body>
    <div class="card">
        <h1>MOTO SYSTEM</h1>
        <div id="statusBox" class="status">ENGINE: OFF</div>
        
        <button id="btnStart" class="btn btn-start">START ENGINE</button>
        <button id="btnStop" class="btn btn-stop">STOP ENGINE</button>

        <div class="anti-theft">
            <div class="toggle-container">
                <span>ANTI-THEFT</span>
                <label class="switch">
                    <input type="checkbox" id="securityToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <p id="securityStatus" style="font-size: 12px; color: #888;">System: Unlocked</p>
        </div>
    </div>

</body>
</html>
